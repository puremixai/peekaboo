# 幽州迂道览胜舆（北京进京证摄像头避让导航）—— 一键部署
#
#   cp .env.example .env    # 填入高德 Key
#   docker compose up -d --build
#   浏览器打开 http://localhost:8080
#
# 更新点位数据（不用重新 build 镜像，也不用重启容器）：
#   ./update.sh             # 抓首页 → 对比 → 补抓详情/评论 → 热重载
#
# 高德 Key 只作为环境变量注入容器，不会写进镜像层，也不会下发到浏览器
# （浏览器只会拿到 AMAP_JS_KEY，那是必须暴露的 Web 端 Key）。

services:
  nav:
    build:
      context: .
      dockerfile: Dockerfile
    image: beijing-camera-nav:latest
    container_name: beijing-camera-nav
    restart: unless-stopped

    ports:
      - "${PORT:-8080}:8080"

    environment:
      # ---- 高德 Key（必填，从 .env 读取） ----
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      # 不填则复用 AMAP_WEB_KEY
      AMAP_JS_KEY: ${AMAP_JS_KEY:-}
      # JS API 2.0 安全密钥，可选。填了就自动启用 /_AMapService 代理转发，密钥不出服务端
      AMAP_SECURITY_CODE: ${AMAP_SECURITY_CODE:-}

      # ---- 数据更新 ----
      # 管理接口令牌。留空则 /api/admin/reload 只允许容器内调用；
      # 要从宿主机触发（推荐做法，见 update.sh）就设一个随机串。
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}

      # ---- 其它 ----
      AMAP_CITY: ${AMAP_CITY:-北京}
      LOG_REQUESTS: ${LOG_REQUESTS:-false}
      # 单次调用高德接口的超时（秒）
      AMAP_TIMEOUT_SEC: ${AMAP_TIMEOUT_SEC:-20}
      TZ: Asia/Shanghai

    volumes:
      # 数据目录挂载：宿主机上跑抓取脚本改完 data/*.json，
      # 调一次 POST /api/admin/reload 就生效，不用重新 build 镜像、也不用重启容器。
      #
      # ⚠ 必须挂「目录」而不是单个文件：写文件用的是 os.replace 原子替换，
      #   会换掉 inode，文件级 bind mount 会一直指向旧 inode 而看不到更新。
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # 规划接口最长要跑一两分钟（串行调用高德十几二十次），
    # 反代/网关的超时也要相应放宽。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 512M
